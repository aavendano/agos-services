version: "3.8"

# Multi-service runtime stack for agos-services monorepo
# See docs/RUNTIME.md for full documentation.

services:
  web-hibel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-hibel
    restart: unless-stopped
    ports:
      - "${WEB_HIBEL_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/agos_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2024-07}
      SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-hi-bel-shopify-mcp}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-0.1.0}
      MCP_AUTH_REQUIRED: ${MCP_AUTH_REQUIRED:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agos-runtime
    command: >
      sh -c "python manage.py migrate &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4"

  analyzer:
    build:
      context: services/tech-commercial-analyzer
      dockerfile: Dockerfile
    container_name: analyzer
    restart: unless-stopped
    ports:
      - "${ANALYZER_PORT:-8001}:8000"
    environment:
      ANALYZER_HOST: ${ANALYZER_HOST:-0.0.0.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agos-runtime

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agos_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agos-runtime

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agos-runtime

volumes:
  pgdata:
  redisdata:

networks:
  agos-runtime:
    driver: bridge
